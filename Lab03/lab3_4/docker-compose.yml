version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lab3_4
      POSTGRES_USER: dino
      POSTGRES_PASSWORD: claudinolab3_4
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/lab3_4
      JDBC_DATABASE_USERNAME: dino
      JDBC_DATABASE_PASSWORD: claudinolab3_4
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
