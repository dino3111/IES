services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: escola
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d escola"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alunos.csv:/app/alunos.csv
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: escola
      DB_USER: user
      DB_PASSWORD: password